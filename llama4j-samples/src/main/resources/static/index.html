<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llama4j Chat</title>
  <style>
    :root {
      --bg-primary: #000000;
      --bg-secondary: #1c1c1e;
      --bg-tertiary: #2c2c2e;
      --bg-hover: #2a2a2c;
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
      --text-tertiary: #636366;
      --accent: #0a84ff;
      --accent-hover: #409cff;
      --border: #38383a;
      --radius: 12px;
      --radius-lg: 18px;
      --danger: #ff453a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .new-chat-btn {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .new-chat-btn:hover {
      background: var(--bg-hover);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .chat-item {
      padding: 12px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
      transition: background 0.2s;
    }

    .chat-item:hover {
      background: var(--bg-hover);
    }

    .chat-item.active {
      background: var(--bg-tertiary);
    }

    .chat-item-icon {
      font-size: 16px;
      width: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    .chat-item-title {
      font-size: 14px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-item-delete {
      opacity: 0;
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      transition: opacity 0.2s;
    }

    .chat-item:hover .chat-item-delete {
      opacity: 1;
    }

    .chat-item-delete:hover {
      color: var(--danger);
    }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Header */
    .header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title {
      font-size: 17px;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      border-color: var(--text-secondary);
      color: var(--text-primary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #30d158;
      box-shadow: 0 0 8px #30d158;
    }

    .status-dot.offline {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    /* Model Selector */
    .model-select {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    .model-select:focus {
      border-color: var(--accent);
    }

    /* Stream Toggle */
    .stream-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 26px;
      background: var(--bg-tertiary);
      border-radius: 13px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .toggle-switch.active {
      background: var(--accent);
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    .toggle-switch.active::after {
      transform: translateX(18px);
    }

    .stream-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .stream-label.active {
      color: var(--accent);
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .message {
      display: flex;
      gap: 16px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .message.assistant .message-avatar {
      background: var(--accent);
      color: white;
    }

    .message.user .message-avatar {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
    }

    .message-body {
      padding-top: 4px;
      max-width: 100%;
    }

    .message-content {
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .message-body {
      text-align: right;
    }

    .message-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .message-images.right {
      justify-content: flex-end;
    }

    .message-images img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    /* Cursor */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      margin-left: 2px;
      animation: blink 1s infinite;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* Input Area */
    .input-area {
      padding: 16px 24px 24px;
      border-top: 1px solid var(--border);
    }

    .input-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .image-preview-bar {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
      padding: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .image-preview-bar.has-images {
      display: flex;
    }

    .image-preview-item {
      position: relative;
    }

    .image-preview-item img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .image-preview-remove {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      background: var(--danger);
      border: 2px solid var(--bg-primary);
      border-radius: 50%;
      color: white;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .attach-btn {
      width: 52px;
      height: 52px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .attach-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .input-box {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 15px;
      color: var(--text-primary);
      resize: none;
      outline: none;
      min-height: 52px;
      max-height: 200px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .input-box:focus {
      border-color: var(--accent);
    }

    .input-box::placeholder {
      color: var(--text-secondary);
    }

    .send-btn {
      width: 52px;
      height: 52px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: var(--accent-hover);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .send-btn:disabled {
      background: var(--bg-tertiary);
      cursor: not-allowed;
    }

    /* Empty State */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    .empty-state-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-state-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      max-width: 400px;
      line-height: 1.5;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border);
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" onclick="createNewChat()">
        <span>+</span> 新建对话
      </button>
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <div class="main">
    <header class="header">
      <div class="header-left">
        <span class="header-title" id="currentChatTitle">新对话</span>
        <select class="model-select" id="modelSelect" onchange="onModelChange()"></select>
      </div>
      <div class="header-actions">
        <div class="stream-toggle">
          <span class="stream-label" id="streamLabel">流式</span>
          <div class="toggle-switch active" id="streamToggle" onclick="toggleStream()"></div>
        </div>
        <button class="clear-btn" onclick="clearCurrentChat()">清空</button>
        <div class="status-dot" id="statusDot"></div>
      </div>
    </header>

    <div class="chat-area" id="chatArea">
      <div class="empty-state">
        <div class="empty-state-title">Llama4j Chat</div>
        <div class="empty-state-subtitle">基于本地大语言模型的智能助手，支持多模态图片理解</div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-container">
        <div class="image-preview-bar" id="imagePreviewBar"></div>
        <div class="input-wrapper">
          <button class="attach-btn" id="attachBtn" onclick="document.getElementById('fileInput').click()" title="上传图片">+</button>
          <input type="file" id="fileInput" accept="image/*" multiple hidden onchange="handleFileSelect(event)">
          <textarea
            class="input-box"
            id="messageInput"
            placeholder="输入消息... (Shift+Enter 换行)"
            rows="1"
            onkeydown="handleKeyDown(event)"
            oninput="autoResize(this)"
          ></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">&#x27A4;</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // State
    let chats = [];
    let currentChatId = null;
    let isStreamMode = true;
    let selectedModel = '';
    let pendingImages = []; // { dataUrl, base64, type }

    // ── Model Management ──

    async function loadModels() {
      try {
        const res = await fetch('/v1/models');
        const data = await res.json();
        const select = document.getElementById('modelSelect');
        select.innerHTML = '';
        (data.models || []).forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.id + (m.default ? ' (default)' : '');
          if (m.default) opt.selected = true;
          select.appendChild(opt);
        });
        selectedModel = select.value;
      } catch {
        selectedModel = 'default';
      }
    }

    function onModelChange() {
      selectedModel = document.getElementById('modelSelect').value;
    }

    // ── Image Handling ──

    function handleFileSelect(event) {
      const files = event.target.files;
      if (!files) return;
      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;
        const reader = new FileReader();
        reader.onload = (e) => {
          const dataUrl = e.target.result;
          const base64 = dataUrl.split(',')[1];
          const type = file.type;
          pendingImages.push({ dataUrl, base64, type });
          renderImagePreviews();
        };
        reader.readAsDataURL(file);
      }
      event.target.value = '';
    }

    function removePendingImage(index) {
      pendingImages.splice(index, 1);
      renderImagePreviews();
    }

    function renderImagePreviews() {
      const bar = document.getElementById('imagePreviewBar');
      if (pendingImages.length === 0) {
        bar.innerHTML = '';
        bar.classList.remove('has-images');
        return;
      }
      bar.classList.add('has-images');
      bar.innerHTML = pendingImages.map((img, i) => `
        <div class="image-preview-item">
          <img src="${img.dataUrl}" alt="preview">
          <button class="image-preview-remove" onclick="removePendingImage(${i})">&times;</button>
        </div>
      `).join('');
    }

    // ── Chat Persistence ──

    function loadChats() {
      const saved = localStorage.getItem('llama4j-chats');
      if (saved) {
        try { chats = JSON.parse(saved); } catch { chats = []; }
      }
      if (chats.length === 0) {
        createNewChat();
      } else {
        renderChatList();
        if (currentChatId) {
          loadChat(currentChatId);
        } else {
          selectChat(chats[0].id);
        }
      }
    }

    function saveChats() {
      localStorage.setItem('llama4j-chats', JSON.stringify(chats));
    }

    function createNewChat() {
      const chat = {
        id: Date.now().toString(),
        title: '新对话',
        messages: [],
        createdAt: Date.now()
      };
      chats.unshift(chat);
      saveChats();
      renderChatList();
      selectChat(chat.id);
    }

    function selectChat(id) {
      currentChatId = id;
      loadChat(id);
      renderChatList();
    }

    function loadChat(id) {
      const chat = chats.find(c => c.id === id);
      if (!chat) return;
      document.getElementById('currentChatTitle').textContent = chat.title || '新对话';
      renderMessages(chat.messages);
    }

    function deleteChat(id, event) {
      event.stopPropagation();
      chats = chats.filter(c => c.id !== id);
      saveChats();
      renderChatList();
      if (currentChatId === id) {
        if (chats.length > 0) selectChat(chats[0].id);
        else createNewChat();
      }
    }

    function clearCurrentChat() {
      const chat = chats.find(c => c.id === currentChatId);
      if (!chat) return;
      chat.messages = [];
      saveChats();
      renderMessages([]);
    }

    // ── Rendering ──

    function renderChatList() {
      const list = document.getElementById('chatList');
      list.innerHTML = chats.map(chat => `
        <div class="chat-item ${chat.id === currentChatId ? 'active' : ''}" onclick="selectChat('${chat.id}')">
          <span class="chat-item-icon">💬</span>
          <span class="chat-item-title">${escapeHtml(chat.title || '新对话')}</span>
          <button class="chat-item-delete" onclick="deleteChat('${chat.id}', event)">x</button>
        </div>
      `).join('');
    }

    function renderMessages(messages) {
      const chatArea = document.getElementById('chatArea');
      if (messages.length === 0) {
        chatArea.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-title">Llama4j Chat</div>
            <div class="empty-state-subtitle">基于本地大语言模型的智能助手，支持多模态图片理解</div>
          </div>
        `;
        return;
      }

      chatArea.innerHTML = messages.map(msg => {
        const isUser = msg.role === 'user';
        const imagesHtml = (msg.images && msg.images.length > 0)
          ? `<div class="message-images ${isUser ? 'right' : ''}">${msg.images.map(src => `<img src="${src}" alt="image">`).join('')}</div>`
          : '';
        return `
          <div class="message ${msg.role}">
            <div class="message-avatar">${isUser ? 'U' : 'AI'}</div>
            <div class="message-body">
              ${imagesHtml}
              <div class="message-content">${escapeHtml(msg.content)}</div>
            </div>
          </div>
        `;
      }).join('');

      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ── Input Helpers ──

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 200) + 'px';
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    // ── Build OpenAI-compatible message ──

    function buildMessageContent(text, images) {
      if (!images || images.length === 0) {
        return text;
      }
      // Multimodal content array
      const parts = [];
      images.forEach(img => {
        parts.push({ type: 'image_url', image_url: { url: `data:${img.type};base64,${img.base64}` } });
      });
      if (text) {
        parts.push({ type: 'text', text: text });
      }
      return parts;
    }

    // ── Send Message ──

    function getCurrentChat() {
      return chats.find(c => c.id === currentChatId);
    }

    async function sendMessage() {
      const text = documentInput().value.trim();
      const images = [...pendingImages];
      if (!text && images.length === 0) return;

      const chat = getCurrentChat();
      if (!chat) return;

      // Save user message with image previews
      const msgData = { role: 'user', content: text || '(image)', images: images.map(i => i.dataUrl) };
      chat.messages.push(msgData);

      if (chat.messages.length === 1) {
        chat.title = (text || '图片消息').slice(0, 30);
        document.getElementById('currentChatTitle').textContent = chat.title;
      }

      // Clear input
      documentInput().value = '';
      documentInput().style.height = 'auto';
      pendingImages = [];
      renderImagePreviews();

      renderMessages(chat.messages);
      saveChats();
      renderChatList();

      setSendBtn(false);

      try {
        if (isStreamMode) {
          await streamResponse(chat, text, images);
        } else {
          await blockingResponse(chat, text, images);
        }
      } finally {
        setSendBtn(true);
        documentInput().focus();
      }
    }

    function documentInput() { return document.getElementById('messageInput'); }
    function setSendBtn(enabled) { document.getElementById('sendBtn').disabled = !enabled; }

    // ── Build API request body ──

    function buildRequestBody(chatMessages, text, images, stream) {
      const openaiMessages = chatMessages.map(m => {
        if (m.images && m.images.length > 0) {
          // Reconstruct multimodal content from stored message
          const parts = [];
          m.images.forEach(src => {
            const base64 = src.split(',')[1];
            const typeMatch = src.match(/data:(image\/\w+);/);
            const imgType = typeMatch ? typeMatch[1] : 'image/png';
            parts.push({ type: 'image_url', image_url: { url: `data:${imgType};base64,${base64}` } });
          });
          if (m.content && m.content !== '(image)') {
            parts.push({ type: 'text', text: m.content });
          }
          return { role: m.role, content: parts };
        }
        return { role: m.role, content: m.content };
      });

      return {
        model: selectedModel,
        messages: openaiMessages,
        stream: stream
      };
    }

    // ── Streaming Response ──

    async function streamResponse(chat, text, images) {
      const chatArea = document.getElementById('chatArea');

      const msgEl = document.createElement('div');
      msgEl.className = 'message assistant';
      msgEl.innerHTML = `
        <div class="message-avatar">AI</div>
        <div class="message-body"><div class="message-content"></div></div>
      `;
      chatArea.appendChild(msgEl);

      const contentEl = msgEl.querySelector('.message-content');
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      contentEl.appendChild(cursor);
      chatArea.scrollTop = chatArea.scrollHeight;

      try {
        const body = buildRequestBody(chat.messages, text, images, true);
        const response = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          const error = await response.text();
          cursor.remove();
          contentEl.textContent = `Error: ${error}`;
          chat.messages.push({ role: 'assistant', content: `Error: ${error}` });
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullContent = '';
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data:')) continue;
            const data = line.slice(5).trim();
            if (data === '[DONE]' || data === '') continue;
            try {
              const json = JSON.parse(data);
              const token = json.choices?.[0]?.delta?.content;
              if (token) {
                fullContent += token;
                contentEl.textContent = fullContent;
                contentEl.appendChild(cursor);
                chatArea.scrollTop = chatArea.scrollHeight;
              }
            } catch (e) { /* skip */ }
          }
        }

        cursor.remove();
        if (fullContent) {
          contentEl.textContent = fullContent;
          chat.messages.push({ role: 'assistant', content: fullContent });
        }
        saveChats();

      } catch (err) {
        cursor.remove();
        contentEl.textContent = `Network error: ${err.message}`;
        chat.messages.push({ role: 'assistant', content: `Network error: ${err.message}` });
      }
    }

    // ── Blocking Response ──

    async function blockingResponse(chat, text, images) {
      const chatArea = document.getElementById('chatArea');

      const loadingEl = document.createElement('div');
      loadingEl.className = 'message assistant';
      loadingEl.innerHTML = `
        <div class="message-avatar">AI</div>
        <div class="message-body"><div class="message-content" style="color: var(--text-secondary)">Thinking...</div></div>
      `;
      chatArea.appendChild(loadingEl);
      chatArea.scrollTop = chatArea.scrollHeight;

      try {
        const body = buildRequestBody(chat.messages, text, images, false);
        const response = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        loadingEl.remove();

        if (!response.ok) {
          const error = await response.text();
          chat.messages.push({ role: 'assistant', content: `Error: ${error}` });
        } else {
          const json = await response.json();
          const content = json.choices?.[0]?.message?.content || '';
          chat.messages.push({ role: 'assistant', content: content });
        }

        saveChats();
        renderMessages(chat.messages);

      } catch (err) {
        loadingEl.remove();
        chat.messages.push({ role: 'assistant', content: `Network error: ${err.message}` });
        saveChats();
        renderMessages(chat.messages);
      }
    }

    // ── Health Check ──

    async function checkHealth() {
      try {
        const res = await fetch('/actuator/health');
        document.getElementById('statusDot').classList.toggle('offline', !res.ok);
      } catch {
        document.getElementById('statusDot').classList.add('offline');
      }
    }

    // ── Init ──
    loadModels();
    loadChats();
    checkHealth();
    setInterval(checkHealth, 30000);
  </script>
</body>
</html>

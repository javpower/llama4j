# llama4j Sample Application Configuration
# ==========================================

server:
  port: 8080

llama4j:
  # 默认模型名称
  default-model: qwen-local

  # API 安全校验（不配或留空则不校验）
  # api:
  #   key: your-secret-key

  # 多模型配置
  models:
    # 本地模型
    - name: qwen-local
      type: local
      path: ${LLAMA4J_MODEL_PATH:/Volumes/macEx/models/qwen2.5-7b-instruct-q4_k_m.gguf}
      n-ctx: 4096
      n-gpu-layers: -1
      n-threads: 8

    # VLM 视觉模型
    - name: qwen2vl
      type: local
      path: /Volumes/macEx/models/Qwen2-VL-2B-Instruct-Q4_K_M.gguf
      mmproj-path: /Volumes/macEx/models/mmproj-Qwen2-VL-2B-Instruct-f16.gguf
      n-ctx: 4096
      n-gpu-layers: -1
      n-threads: 8
#    - name: deepseek
#      type: openai
#      api-key: ${LLAMA4J_API_KEY:CHANGE_ME_IN_PRODUCTION}
#      base-url: https://api.minimaxi.com/v1
#      model-name: MiniMax-M2.7

    # OpenAI 兼容云端模型（取消注释即可使用）
    # - name: deepseek
    #   type: openai
    #   api-key: ${DEEPSEEK_API_KEY:sk-xxx}
    #   base-url: https://api.deepseek.com
    #   model-name: deepseek-chat

    # - name: gpt4o
    #   type: openai
    #   api-key: ${OPENAI_API_KEY:sk-xxx}
    #   base-url: https://api.openai.com
    #   model-name: gpt-4o

  inference:
    temperature: 0.7
    max-tokens: 2048
    top-k: 40
    top-p: 0.9
    repeat-penalty: 1.1

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.llama4j: DEBUG
    org.springframework.web: INFO

name: Build Native Libraries

on:
  workflow_dispatch:
    inputs:
      build_macos_aarch64:
        description: "Build macOS ARM64"
        type: boolean
        default: true
      build_macos_x86_64:
        description: "Build macOS x86_64"
        type: boolean
        default: true
      build_linux_x86_64:
        description: "Build Linux x86_64"
        type: boolean
        default: true
      build_windows_x86_64:
        description: "Build Windows x86_64"
        type: boolean
        default: true
      package_java:
        description: "Package final JAR (requires all selected builds to succeed)"
        type: boolean
        default: false

env:
  LLAMA_CPP_VERSION: "master"
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"

jobs:
  build-macos-aarch64:
    name: macos-aarch64 (metal)
    if: ${{ inputs.build_macos_aarch64 }}
    runs-on: macos-14
    steps:
      - name: Checkout llama4j
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: /tmp/llama.cpp
          key: llama-cpp-macos-aarch64-metal-master

      - name: Build
        run: |
          chmod +x scripts/build-native.sh
          ./scripts/build-native.sh \
            --classifier macos-aarch64 \
            --gpu metal \
            --jobs $(sysctl -n hw.ncpu)

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-macos-aarch64
          path: llama4j-native/src/main/resources/native/macos-aarch64/
          retention-days: 1

  build-macos-x86_64:
    name: macos-x86_64 (metal)
    if: ${{ inputs.build_macos_x86_64 }}
    runs-on: macos-13
    steps:
      - name: Checkout llama4j
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: /tmp/llama.cpp
          key: llama-cpp-macos-x86_64-metal-master

      - name: Build
        run: |
          chmod +x scripts/build-native.sh
          ./scripts/build-native.sh \
            --classifier macos-x86_64 \
            --gpu metal \
            --jobs $(sysctl -n hw.ncpu)

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-macos-x86_64
          path: llama4j-native/src/main/resources/native/macos-x86_64/
          retention-days: 1

  build-linux-x86_64:
    name: linux-x86_64 (cuda)
    if: ${{ inputs.build_linux_x86_64 }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout llama4j
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: /tmp/llama.cpp
          key: llama-cpp-linux-x86_64-cuda-master

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc g++

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.6.2'
          method: 'network'

      - name: Build
        run: |
          chmod +x scripts/build-native.sh
          ./scripts/build-native.sh \
            --classifier linux-x86_64 \
            --gpu cuda \
            --jobs $(nproc)

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-linux-x86_64
          path: llama4j-native/src/main/resources/native/linux-x86_64/
          retention-days: 1

  build-windows-x86_64:
    name: windows-x86_64 (cuda)
    if: ${{ inputs.build_windows_x86_64 }}
    runs-on: windows-2022
    steps:
      - name: Checkout llama4j
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.6.2'
          method: 'network'

      - name: Build
        shell: pwsh
        run: |
          .\scripts\build-native.ps1 `
            -Classifier windows-x86_64 `
            -Gpu cuda

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-windows-x86_64
          path: llama4j-native/src/main/resources/native/windows-x86_64/
          retention-days: 1

  package-java:
    name: Package Java JAR
    if: ${{ inputs.package_java }}
    needs:
      - build-macos-aarch64
      - build-macos-x86_64
      - build-linux-x86_64
      - build-windows-x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout llama4j
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Download all native library artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-artifacts/
          pattern: native-libs-*
          merge-multiple: false

      - name: Place native libraries into resources
        run: |
          for dir in native-artifacts/native-libs-*/; do
            classifier=$(basename "$dir" | sed 's/native-libs-//')
            target="llama4j-native/src/main/resources/native/$classifier"
            mkdir -p "$target"
            cp -r "$dir"* "$target/"
            echo "已放置: $classifier"
            ls "$target/"
          done

      - name: Build and package
        run: mvn clean package -DskipTests -Dmaven.javadoc.skip=true

      - name: Upload final JAR
        uses: actions/upload-artifact@v4
        with:
          name: llama4j-complete
          path: llama4j-native/target/*.jar
          retention-days: 1

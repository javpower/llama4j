name: Build Native Libraries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  LLAMA_CPP_VERSION: "master"
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"

jobs:
  build-native:
    name: ${{ matrix.classifier }} (${{ matrix.gpu_backend }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            classifier: macos-aarch64
            gpu_backend: metal
          - runner: macos-13
            classifier: macos-x86_64
            gpu_backend: metal
          - runner: ubuntu-22.04
            classifier: linux-x86_64
            gpu_backend: cuda
          - runner: windows-2022
            classifier: windows-x86_64
            gpu_backend: cuda

    steps:
      - name: Checkout llama4j
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: /tmp/llama.cpp
          key: llama-cpp-${{ matrix.classifier }}-${{ matrix.gpu_backend }}-master

      - name: Setup CUDA Toolkit (Linux/Windows)
        if: matrix.gpu_backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.6.2'
          method: 'network'

      # ── macOS build ──
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/build-native.sh
          ./scripts/build-native.sh \
            --classifier ${{ matrix.classifier }} \
            --gpu ${{ matrix.gpu_backend }} \
            --jobs $(sysctl -n hw.ncpu)

      # ── Linux build ──
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc g++

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/build-native.sh
          ./scripts/build-native.sh \
            --classifier ${{ matrix.classifier }} \
            --gpu ${{ matrix.gpu_backend }} \
            --jobs $(nproc)

      # ── Windows build ──
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\build-native.ps1 `
            -Classifier ${{ matrix.classifier }} `
            -Gpu ${{ matrix.gpu_backend }}

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-${{ matrix.classifier }}
          path: llama4j-native/src/main/resources/native/${{ matrix.classifier }}/
          retention-days: 5

  package-java:
    name: Package Java JAR
    needs: build-native
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout llama4j
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Download all native library artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-artifacts/
          pattern: native-libs-*
          merge-multiple: false

      - name: Place native libraries into resources
        run: |
          for dir in native-artifacts/native-libs-*/; do
            classifier=$(basename "$dir" | sed 's/native-libs-//')
            target="llama4j-native/src/main/resources/native/$classifier"
            mkdir -p "$target"
            cp -r "$dir"* "$target/"
            echo "已放置: $classifier"
            ls "$target/"
          done

      - name: Build and package
        run: mvn clean package -DskipTests -Dmaven.javadoc.skip=true

      - name: Upload final JAR
        uses: actions/upload-artifact@v4
        with:
          name: llama4j-complete
          path: llama4j-native/target/*.jar
          retention-days: 30
